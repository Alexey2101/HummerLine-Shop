    </div>

    <nav class="flex flex-col gap-4 lg:flex-row lg:items-center" aria-label="Главная навигация">
      <ul class="flex flex-wrap items-center gap-2 text-sm font-medium text-muted-foreground list-none p-0 m-0">
        <li>
          <a href="{% url 'shop:home' %}" class="rounded-full px-4 py-2 transition hover:bg-steel-100 hover:text-steel-950">
            Главная
          </a>
        </li>
        <li>
          <a href="{% url 'shop:product_list' %}" class="rounded-full px-4 py-2 transition hover:bg-steel-100 hover:text-steel-950">
            Все товары
          </a>
        </li>
        
        {% if user.is_authenticated %}
        <li>
          <a href="{% url 'shop:product_create' %}" class="rounded-full bg-ember-500 text-white px-4 py-2 transition hover:bg-ember-600 flex items-center gap-2 font-bold shadow-sm mr-2">
            <i data-lucide="plus-circle" class="w-4 h-4"></i> Разместить объявление
          </a>
        </li>
        
        <li>
          <a href="{% url 'shop:cart_detail' %}" class="rounded-full px-4 py-2 transition hover:bg-steel-100 hover:text-steel-950 flex items-center gap-2 mr-2">
            <i data-lucide="shopping-cart" class="w-4 h-4"></i> Корзина 
            <span id="cart-count" class="bg-steel-900 text-white rounded-full px-2 py-0.5 text-xs">0</span>
            (<span id="cart-total-price">0.00</span> ₸)
          </a>
        </li>
        {% endif %}
      </ul>

      <!-- Профиль -->
      <div class="flex items-center">
        <div class="hidden lg:block w-px h-6 bg-border/70 mx-1"></div>
        
        {% if user.is_authenticated %}
          <!-- Опции профиля с выпадающим меню -->
          <div class="relative group">
            <button id="profile-dropdown-btn" class="flex items-center gap-2 px-4 py-2 font-semibold text-steel-950 rounded-full transition hover:bg-steel-100 focus:outline-none" aria-haspopup="true" aria-expanded="false" aria-controls="profile-dropdown-menu">
              <i data-lucide="user" class="w-4 h-4 text-emerald-600"></i> {{ user.username }}
              <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground transition-transform duration-200" id="profile-dropdown-icon"></i>
            </button>
            
            <!-- Dropdown Menu -->
            <div id="profile-dropdown-menu" class="absolute right-0 mt-2 w-48 rounded-2xl bg-white shadow-display border border-border/70 opacity-0 invisible translate-y-2 transition-all duration-200 z-50" role="menu">
              <div class="p-2 flex flex-col gap-1">
                <a href="{% url 'shop:my_purchases' %}" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-steel-700 rounded-lg transition hover:bg-steel-50 hover:text-steel-950" role="menuitem">
                  <i data-lucide="shopping-bag" class="w-4 h-4 text-emerald-600"></i> Мои покупки
                </a>
                <a href="{% url 'shop:my_ads' %}" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-steel-700 rounded-lg transition hover:bg-steel-50 hover:text-steel-950" role="menuitem">
                  <i data-lucide="package-open" class="w-4 h-4 text-emerald-600"></i> Мои объявления
                </a>
                <a href="{% url 'shop:chat_list' %}" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-steel-700 rounded-lg transition hover:bg-steel-50 hover:text-steel-950" role="menuitem">
                  <i data-lucide="message-circle" class="w-4 h-4 text-ember-500"></i> Сообщения
                </a>
                <a href="{% url 'shop:favorites_list' %}" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-steel-700 rounded-lg transition hover:bg-steel-50 hover:text-steel-950" role="menuitem">
                  <svg viewBox="0 0 24 24" class="w-4 h-4 fill-amber-500 stroke-amber-500" aria-hidden="true">
                      <path d="M11.2691 4.41115C11.5006 3.89177 11.6164 3.63208 11.7776 3.55211C11.9176 3.48263 12.082 3.48263 12.222 3.55211C12.3832 3.63208 12.499 3.89177 12.7305 4.41115L14.5745 8.54808C14.643 8.70162 14.6772 8.77839 14.7302 8.83718C14.777 8.8892 14.8343 8.93081 14.8982 8.95929C14.9705 8.99149 15.0541 9.00031 15.2213 9.01795L19.7256 9.49336C20.2911 9.55304 20.5738 9.58288 20.6997 9.71147C20.809 9.82316 20.8598 9.97956 20.837 10.1342C20.8108 10.3122 20.5996 10.5025 20.1772 10.8832L16.8125 13.9154C16.6877 14.0279 16.6252 14.0842 16.5857 14.1527C16.5507 14.2134 16.5288 14.2807 16.5215 14.3503C16.5132 14.429 16.5306 14.5112 16.5655 14.6757L17.5053 19.1064C17.6233 19.6627 17.6823 19.9408 17.5989 20.1002C17.5264 20.2388 17.3934 20.3615C17.0619 20.3915 16.8156 20.2495 16.323 19.9654L12.3995 17.7024C12.2539 17.6184 12.1811 17.5765 12.1037 17.56C12.0352 17.5455 11.9644 17.5455 11.8959 17.56C11.8185 17.5765 11.7457 17.6184 11.6001 17.7024L7.67662 19.9654C7.18404 20.2495 6.93775 20.3915 6.76034 20.3615C6.60623 20.3354 6.47319 20.2388 6.40075 20.1002C6.31736 19.9408 6.37635 19.6627 6.49434 19.1064L7.4341 14.6757C7.46898 14.5112 7.48642 14.429 7.47814 14.3503C7.47081 14.2807 7.44894 14.2134 7.41394 14.1527C7.37439 14.0842 7.31195 14.0279 7.18708 13.9154L3.82246 10.8832C3.40005 10.5025 3.18884 10.3122 3.16258 10.1342C3.13978 9.97956 3.19059 9.82316 3.29993 9.71147C3.42581 9.58288 3.70856 9.55304 4.27406 9.49336L8.77835 9.01795C8.94553 9.00031 9.02911 8.99149 9.10139 8.95929C9.16534 8.93081 9.2226 8.8892 9.26946 8.83718C9.32241 8.77839 9.35663 8.70162 9.42508 8.54808L11.2691 4.41115Z" />
                  </svg> Избранное
                </a>
                
                <div class="h-px bg-border/70 my-1"></div>
                
                <!-- Выход -->
                <form method="POST" action="{% url 'logout' %}" class="w-full" role="none">
                  {% csrf_token %}
                  <button type="submit" class="w-full flex items-center gap-2 px-3 py-2 text-sm font-medium text-red-600 rounded-lg transition hover:bg-red-50 hover:text-red-700" role="menuitem">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Выйти
                  </button>
                </form>
              </div>
            </div>
          </div>
        {% else %}
          <div class="flex items-center gap-2">
            <a href="{% url 'shop:delivery_register' %}" class="rounded-full px-4 py-2 transition hover:bg-steel-100 hover:text-steel-950 flex items-center gap-1.5">
              <i data-lucide="truck" class="w-4 h-4"></i> Доставка
            </a>
            <a href="{% url 'login' %}" class="rounded-full px-4 py-2 transition hover:bg-steel-100 hover:text-steel-950">
              Вход
            </a>
            <a href="{% url 'register' %}" class="rounded-full bg-steel-950 text-white px-5 py-2 transition hover:bg-ember-500 shadow-sm ml-1">
              Регистрация
            </a>
          </div>
        {% endif %}
      </div>
    </nav>
  </div>
</header>
