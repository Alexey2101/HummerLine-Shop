<!-- Category Sidebar Component -->
<aside aria-labelledby="categories-heading">
  <div class="sticky top-28 space-y-6">
    <!-- Сайдбар категорий -->
    <div class="sidebar-card">
      <h3 class="font-display text-xl font-bold text-steel-950 mb-4" id="categories-heading">Категории</h3>
      <ul class="space-y-3">
        <li>
          <a href="{% url 'shop:product_list' %}{% if search_query %}?q={{ search_query }}{% endif %}" 
             class="flex items-center gap-2 text-sm font-medium transition hover:text-ember-600 {% if not category %}text-ember-600 font-bold{% else %}text-muted-foreground{% endif %}">
            <i data-lucide="boxes" class="w-4 h-4"></i> Все товары
          </a>
        </li>
        {% for c in categories %}
        <li>
          <a href="{{ c.get_absolute_url }}{% if search_query %}?q={{ search_query }}{% endif %}" 
             class="flex items-center gap-2 text-sm font-medium transition hover:text-ember-600 {% if category.slug == c.slug %}text-ember-600 font-bold{% else %}text-muted-foreground{% endif %}">
            <i data-lucide="package" class="w-4 h-4"></i> {{ c.name }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>

    <!-- Фильтр по цене -->
    <div class="sidebar-card">
      <h3 class="font-display text-xl font-bold text-steel-950 mb-4">Цена</h3>
      <form action="{{ request.path }}" method="get" class="space-y-4">
        {% if search_query %}
          <input type="hidden" name="q" value="{{ search_query }}">
        {% endif %}
        {% if current_sort %}
          <input type="hidden" name="sort" value="{{ current_sort }}">
        {% endif %}
        <div class="grid grid-cols-2 gap-2">
          <input type="number" name="min_price" value="{{ request.GET.min_price|default:'' }}" 
                 placeholder="От" inputmode="decimal" 
                 class="w-full rounded-xl border border-border p-2.5 text-xs focus:ring-2 focus:ring-ember-500 outline-none bg-white shadow-sm">
          <input type="number" name="max_price" value="{{ request.GET.max_price|default:'' }}" 
                 placeholder="До" inputmode="decimal" 
                 class="w-full rounded-xl border border-border p-2.5 text-xs focus:ring-2 focus:ring-ember-500 outline-none bg-white shadow-sm">
        </div>
        <button type="submit" class="w-full rounded-xl bg-steel-950 py-2.5 text-xs font-bold text-white transition hover:bg-ember-500">
          Применить
        </button>
      </form>
    </div>
  </div>
</aside>
